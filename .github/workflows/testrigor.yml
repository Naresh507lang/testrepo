- name: Poll test results
  id: poll
  run: |
    run_id="${{ steps.trigger.outputs.run_id }}"
    echo "Polling for testRigor test results for run ID: $run_id"

    for i in {1..30}; do
      echo "Polling attempt $i..."
      response=$(curl -s -w "\n%{http_code}" -X GET "https://api.testrigor.com/v1/test_runs/$run_id" \
        -H "Authorization: Bearer ${{ secrets.TR_API_KEY }}")

      # Split response and HTTP status
      http_body=$(echo "$response" | head -n -1)
      http_code=$(echo "$response" | tail -n1)

      echo "HTTP Status: $http_code"

      if [[ "$http_code" -ne 200 ]]; then
        echo "❌ Failed to fetch test results. HTTP status $http_code"
        echo "Response: $http_body"
        exit 1
      fi

      # Try parsing the JSON status field
      status=$(echo "$http_body" | jq -r '.status' 2>/dev/null || echo "parse_error")

      if [[ "$status" == "parse_error" ]]; then
        echo "❌ Failed to parse JSON response:"
        echo "$http_body"
        exit 1
      fi

      echo "Current status: $status"

      if [[ "$status" == "FINISHED" || "$status" == "FAILED" ]]; then
        break
      fi

      sleep 10
    done

    if [[ "$status" != "FINISHED" ]]; then
      echo "❌ TestRigor tests did not finish successfully. Final status: $status"
      exit 1
    fi

    echo "✅ TestRigor tests finished with status: $status"
