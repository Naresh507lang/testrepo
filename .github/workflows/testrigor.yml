name: Run TestRigor Tests

on:
  push:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger TestRigor Tests
        uses: testrigor/testrigor-github-action@v1
        with:
          email: ${{ secrets.TR_EMAIL }}
          api_token: ${{ secrets.TR_API_KEY }}
          test_suite_id: ${{ secrets.TR_SUITE_ID }}
          git_branch: main
