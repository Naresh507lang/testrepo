# .github/workflows/testrigor.yml
name: testRigor CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Trigger testRigor Test Suite via API
        run: |
          curl --request POST \
            --url "https://api.testrigor.com/test_suites/${{ secrets.TR_SUITE_ID }}/execute" \
            --header "Authorization: Token ${{ secrets.TR_API_KEY }}" \
            --header "Content-Type: application/json"

      - name: Deploy to production
        if: success()
        run: echo "🚀 Deploying to production..."
