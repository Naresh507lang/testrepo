name: Run testRigor Tests (CI/CD)

on:
  push:
    branches:
      - main   # or change to your target branch
  pull_request:
    branches:
      - main

jobs:
  test-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install jq (for JSON parsing)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Trigger testRigor Test Suite via API
        id: trigger
        run: |
          echo "📤 Triggering test run..."

          response=$(curl -s -X POST "https://app.testrigor.com/api/v1/test_suites/${{ secrets.TR_SUITE_ID }}/execute.json" \
            -H "Authorization: Token ${{ secrets.TR_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{ "branch": "main" }')

          echo "API Response: $response"

          run_id=$(echo "$response" | jq -r '.id')

          if [ "$run_id" == "null" ] || [ -z "$run_id" ]; then
            echo "❌ Failed to trigger test run."
            exit 1
          fi

          echo "✅ Test run started with ID: $run_id"
          echo "run_id=$run_id" >> $GITHUB_ENV

      - name: Poll testRigor for test run status
        run: |
          echo "⏳ Polling test status..."

          while true; do
            sleep 15

            status_response=$(curl -s -H "Authorization: Token ${{ secrets.TR_API_KEY }}" \
              "https://app.testrigor.com/api/v1/test_runs/$run_id.json")

            state=$(echo "$status_response" | jq -r '.state')
            result=$(echo "$status_response" | jq -r '.result')

            echo "🔄 Status: $state | Result: $result"

            if [[ "$state" == "finished" ]]; then
              if [[ "$result" == "passed" ]]; then
                echo "✅ Tests Passed."
                exit 0
              else
                echo "❌ Tests Failed."
                exit 1
              fi
            elif [[ "$state" == "failed" ]]; then
              echo "❌ Test execution failed internally."
              exit 1
            fi
          done
