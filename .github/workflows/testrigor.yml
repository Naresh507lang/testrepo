- name: Trigger testRigor Test Suite (debug)
  run: |
    echo "📤 Triggering test run..."

    URL="https://app.testrigor.com/api/v1/test_suites/${{ secrets.TR_SUITE_ID }}/execute.json"

    echo "Calling: $URL"

    http_response=$(curl -s -w "\n%{http_code}" -X POST "$URL" \
      -H "Authorization: Token ${{ secrets.TR_API_KEY }}" \
      -H "Content-Type: application/json" \
      -d '{ "branch": "main" }')

    echo "----- Raw API Response -----"
    echo "$http_response"
    echo "----------------------------"

    body=$(echo "$http_response" | sed '$d')
    status=$(echo "$http_response" | tail -n1)

    echo "📩 HTTP Status: $status"
    echo "📦 Response Body: $body"

    if [ "$status" != "200" ]; then
      echo "❌ API call failed with status code $status"
      exit 1
    fi

    run_id=$(echo "$body" | jq -r '.id')

    if [ "$run_id" == "null" ] || [ -z "$run_id" ]; then
      echo "❌ No run ID returned."
      exit 1
    fi

    echo "✅ Test run started with ID: $run_id"
    echo "run_id=$run_id" >> $GITHUB_ENV
